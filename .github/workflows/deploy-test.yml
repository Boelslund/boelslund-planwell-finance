name: Deploy to Test Environment

on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  # Test first: Validate the PR code before any version bumping
  # This ensures we only bump versions for code that passes all checks
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:ci

  # Build and deploy only after tests pass
  # Version bump happens here (not before tests) because:
  # - We want to test the actual PR code, not code + version change
  # - If tests fail, no version bump occurs (fail-safe)
  # - Version bump only changes metadata (package.json version number)
  # - The deployed build and git tag both use the bumped version
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Escalate to 'write' to allow automated version bumping and tag pushing
      # This job commits package.json changes and pushes version tags
      contents: write
    environment:
      name: test
      url: https://boelslund-planwell-finance-dev.web.app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version bump type from merged PR
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            // Get the commit that triggered this workflow
            const commit = context.sha;

            // Find the PR that was merged
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commit
            });

            // Filter to only merged PRs (exclude open/closed but unmerged PRs)
            const mergedPrs = prs.filter(pr => pr.merged_at !== null);

            if (mergedPrs.length === 0) {
              core.info(`No merged PR found for commit: ${commit}`);
              core.warning('No merged PR found for this commit. Using default patch version bump.');
              core.notice('Direct commits to test branch will default to patch version. Use PRs with version labels for proper semantic versioning.');
              core.setOutput('bump', 'patch');
              return;
            }

            const pr = mergedPrs[0];
            const labels = pr.labels.map(label => label.name);

            let bump = 'patch'; // default
            if (labels.includes('version:major')) {
              bump = 'major';
            } else if (labels.includes('version:minor')) {
              bump = 'minor';
            } else if (labels.includes('version:patch')) {
              bump = 'patch';
            }

            core.setOutput('bump', bump);
            core.info(`Version bump type from PR: ${bump}`);

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BUMP_TYPE="${{ steps.version.outputs.bump }}"

          # Keep bumping until we find a version that doesn't exist
          MAX_ATTEMPTS=10
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            # Calculate next version
            NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version | sed 's/^v//')
            
            # Check if tag already exists
            if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
              echo "Tag v$NEW_VERSION already exists, trying next patch version..."
              # Reset and try next patch version
              git checkout -- package.json package-lock.json
              BUMP_TYPE="patch"
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "Creating new version: v$NEW_VERSION"
              # Commit and tag the version bump
              git add package.json package-lock.json
              git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
              git tag -a "v$NEW_VERSION" -m "chore: bump version to $NEW_VERSION [skip ci]"
              git push --follow-tags
              break
            fi
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Error: Could not find available version tag after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy to Firebase Hosting (test)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          target: test
