name: Deploy to Test Environment

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

permissions:
  contents: read

jobs:
  # Test job always runs to satisfy required status check
  # but exits early on version bump commits
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check if should skip
        id: check_skip
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" =~ \[skip ci\]|\[ci skip\]|^chore: bump version|^chore\(release\): ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "✓ Skipping tests - version bump or [skip ci] commit"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check_skip.outputs.should_skip != 'true'

      - name: Setup Node.js
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.check_skip.outputs.should_skip != 'true'
        run: npm ci

      - name: Run linter
        if: steps.check_skip.outputs.should_skip != 'true'
        run: npm run lint

      - name: Run tests with coverage
        if: steps.check_skip.outputs.should_skip != 'true'
        run: npm run test:ci

  # Build and deploy only after tests pass and only on push to test (not on PRs)
  # Version bumping uses GITHUB_TOKEN with Deploy Keys bypass configured in test ruleset
  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push version bump commits and tags
    environment:
      name: test
      url: https://boelslund-planwell-finance-dev.web.app
    steps:
      - name: Check if should skip deployment
        id: check_skip
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" =~ \[skip ci\]|\[ci skip\]|^chore: bump version|^chore\(release\): ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "✓ Skipping deployment - version bump or [skip ci] commit"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check_skip.outputs.should_skip != 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version bump type from merged PR
        if: steps.check_skip.outputs.should_skip != 'true'
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commit
            });

            const mergedPrs = prs.filter(pr => pr.merged_at !== null);

            if (mergedPrs.length === 0) {
              core.info('No merged PR found - skipping version bump');
              core.setOutput('should_bump', 'false');
              return;
            }

            const pr = mergedPrs[0];
            const labels = pr.labels.map(label => label.name);

            let bump = 'patch';
            if (labels.includes('version:major')) bump = 'major';
            else if (labels.includes('version:minor')) bump = 'minor';
            else if (labels.includes('version:patch')) bump = 'patch';

            core.setOutput('bump', bump);
            core.setOutput('should_bump', 'true');
            core.info(`Version bump: ${bump}`);

      - name: Setup Node.js
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.check_skip.outputs.should_skip != 'true'
        run: npm ci

      - name: Bump version and push
        if: steps.check_skip.outputs.should_skip != 'true' && steps.version.outputs.should_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.version.outputs.bump }} -m "chore: bump version to %s [skip ci]"
          git push --follow-tags

      - name: Build
        if: steps.check_skip.outputs.should_skip != 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy to Firebase Hosting (test)
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          target: test
